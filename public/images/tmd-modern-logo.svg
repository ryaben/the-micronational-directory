<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">The Micronational Directory</title>
  <desc id="desc">A modern white and cyan TMD emblem with the full organization name on a deep navy background.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65e5ee"/>
      <stop offset="1" stop-color="#4aa8ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" rx="28" fill="#0b1220"/>
  <g transform="translate(48 42)">
    <circle cx="158" cy="158" r="133" fill="none" stroke="#eaf3ff" stroke-width="12"/>
    <path d="M76 235a112 112 0 0 0 184-145A112 112 0 0 0 78 99" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <text x="158" y="180" text-anchor="middle" fill="#ffffff" font-family="Inter, Montserrat, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">TMD</text>
  </g>
  <rect x="380" y="82" width="2" height="236" rx="1" fill="#334155"/>
  <rect x="380" y="82" width="3" height="236" rx="1.5" fill="url(#accent)"/>
  <text x="438" y="153" fill="#a8b6ca" font-family="Inter, Montserrat, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="9">THE</text>
  <text x="438" y="239" fill="#ffffff" font-family="Inter, Montserrat, Arial, sans-serif" font-size="65" font-weight="750" letter-spacing="1.5">MICRONATIONAL</text>
  <text x="438" y="314" fill="#ffffff" font-family="Inter, Montserrat, Arial, sans-serif" font-size="65" font-weight="750" letter-spacing="1.5">DIRECTORY</text>
  <rect x="438" y="340" width="123" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
